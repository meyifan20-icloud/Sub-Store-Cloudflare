name: Bootstrap Sub-Store Cloudflare source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-import.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import reference implementation
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/realchendahuang/sub-store-cloudflare.git /tmp/sub-store-cloudflare-upstream

          rsync -a --delete             --exclude '.git/'             --exclude '.github/workflows/bootstrap-import.yml'             /tmp/sub-store-cloudflare-upstream/ ./

          test -f LICENSE
          test -f NOTICE
          test -f package.json
          test -f wrangler.jsonc
          test -f cloudflare/src/index.ts
          test -f frontend/package.json

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes"
            exit 0
          fi
          git commit -m "chore: bootstrap Cloudflare-native Sub-Store"
          git push origin main
