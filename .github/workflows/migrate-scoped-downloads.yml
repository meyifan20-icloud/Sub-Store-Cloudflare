name: Migrate to scoped download grants

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-scoped-downloads.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Apply personal scoped-download architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def must_replace(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:100]!r}")
              write(path, text.replace(old, new))

          # Worker download auth: Scoped Grant is the only download credential.
          must_replace(
              "cloudflare/src/routes/download.ts",
              'import { failed, isTokenValid } from "../lib/http";',
              'import { failed } from "../lib/http";',
          )
          must_replace(
              "cloudflare/src/routes/download.ts",
              '''  const token = getDownloadToken(c);
            if (await isTokenValid(c.env.SUB_STORE_PUBLIC_DOWNLOAD_TOKEN, token)) return undefined;
            if (await authorizeScopedDownload(c.env, token, resourceType, resourceId, target)) return undefined;
            return failed(c, "Download token is invalid", 403);''',
              '''  const token = getDownloadToken(c);
            if (await authorizeScopedDownload(c.env, token, resourceType, resourceId, target)) return undefined;
            return failed(c, "Scoped download grant is invalid", 403);''',
          )

          # /api/link now issues a fresh scoped grant and returns its one-time URL.
          must_replace(
              "cloudflare/src/routes/api.ts",
              '  const link = buildDownloadLink(c, "source", sub.id);',
              '  const link = await buildDownloadLink(c, "source", sub.id);',
          )
          must_replace(
              "cloudflare/src/routes/api.ts",
              '  const link = buildDownloadLink(c, "collection", collection.id);',
              '  const link = await buildDownloadLink(c, "collection", collection.id);',
          )
          old = '''function buildDownloadLink(c: ApiContext, kind: "source" | "collection", id: string) {
            const rawTarget = c.req.query("target");
            const target = normalizeDownloadTarget(rawTarget);
            if (rawTarget && !target) return undefined;
            const path = ["/download", kind, encodeURIComponent(id), target].filter(Boolean).join("/");
            const url = new URL(path, getPublicBaseUrl(c));
            if (c.env.SUB_STORE_PUBLIC_DOWNLOAD_TOKEN) url.searchParams.set("token", c.env.SUB_STORE_PUBLIC_DOWNLOAD_TOKEN);
            for (const key of ["url", "content", "ua", "userAgent"]) {
              const value = c.req.query(key);
              if (value) url.searchParams.set(key, value);
            }
            return { url: url.toString(), target: target || "auto", tokenIncluded: Boolean(c.env.SUB_STORE_PUBLIC_DOWNLOAD_TOKEN) };
          }'''
          new = '''async function buildDownloadLink(c: ApiContext, kind: "source" | "collection", id: string) {
            const rawTarget = c.req.query("target");
            const target = normalizeDownloadTarget(rawTarget);
            if (rawTarget && !target) return undefined;

            const created = await createDownloadGrant(c.env, {
              resourceType: kind,
              resourceId: id,
              target,
            });
            const path = ["/download", kind, encodeURIComponent(id), target].filter(Boolean).join("/");
            const url = new URL(path, getPublicBaseUrl(c));
            url.searchParams.set("token", created.token);
            for (const key of ["url", "content", "ua", "userAgent"]) {
              const value = c.req.query(key);
              if (value) url.searchParams.set(key, value);
            }
            return {
              url: url.toString(),
              target: target || "auto",
              tokenIncluded: true,
              grantId: created.grant?.id,
            };
          }'''
          must_replace("cloudflare/src/routes/api.ts", old, new)

          # Wrangler / Deploy-to-Cloudflare metadata: one Worker Secret only.
          for path in ["wrangler.jsonc", "cloudflare/wrangler.jsonc"]:
              cfg = json.loads(read(path))
              cfg["secrets"] = {"required": ["SUB_STORE_ADMIN_TOKEN"]}
              write(path, json.dumps(cfg, ensure_ascii=False, indent=2) + "\n")

          dev = read("cloudflare/.dev.vars.example")
          dev = "\n".join(
              line for line in dev.splitlines()
              if not line.startswith("SUB_STORE_PUBLIC_DOWNLOAD_TOKEN=")
          ) + "\n"
          write("cloudflare/.dev.vars.example", dev)

          types = read("cloudflare/src/worker-configuration.d.ts")
          types = types.replace("\n\tSUB_STORE_PUBLIC_DOWNLOAD_TOKEN: string;", "")
          types = types.replace(
              ' | "SUB_STORE_PUBLIC_DOWNLOAD_TOKEN"',
              "",
          )
          write("cloudflare/src/worker-configuration.d.ts", types)

          vitest = read("cloudflare/vitest.config.ts")
          vitest = re.sub(r'^\s*SUB_STORE_PUBLIC_DOWNLOAD_TOKEN: "test-download-token",\n', "", vitest, flags=re.M)
          write("cloudflare/vitest.config.ts", vitest)

          pkg = json.loads(read("package.json"))
          pkg["scripts"]["token:generate"] = "node scripts/generate-admin-token.mjs"
          pkg["scripts"].pop("tokens:generate", None)
          pkg["cloudflare"]["bindings"].pop("SUB_STORE_PUBLIC_DOWNLOAD_TOKEN", None)
          write("package.json", json.dumps(pkg, ensure_ascii=False, indent=2) + "\n")

          old_token_script = Path("scripts/generate-deployment-tokens.mjs")
          if old_token_script.exists():
              old_token_script.unlink()
          write(
              "scripts/generate-admin-token.mjs",
              '''import { randomBytes } from "node:crypto";

          const token = () => randomBytes(32).toString("base64url");

          console.log("Generate the Worker admin secret and keep it private:");
          console.log("");
          console.log(`SUB_STORE_ADMIN_TOKEN=${token()}`);
          console.log("");
          console.log("Subscription download links use scoped D1 grants generated by the admin API.");
          console.log("Do not commit this value or paste it into an issue.");
          ''',
          )

          # Deployment config generator.
          must_replace(
              "scripts/render-wrangler-config.mjs",
              'required: ["SUB_STORE_ADMIN_TOKEN", "SUB_STORE_PUBLIC_DOWNLOAD_TOKEN"]',
              'required: ["SUB_STORE_ADMIN_TOKEN"]',
          )

          # Deployment-experience checks.
          checks = read("scripts/check-deploy-experience.mjs")
          checks = checks.replace(
              'for (const secret of ["SUB_STORE_ADMIN_TOKEN", "SUB_STORE_PUBLIC_DOWNLOAD_TOKEN"])',
              'for (const secret of ["SUB_STORE_ADMIN_TOKEN"])',
          )
          checks = checks.replace('"tokens:generate",', '"token:generate",')
          checks = checks.replace('"tokens:generate",', '"token:generate",')
          write("scripts/check-deploy-experience.mjs", checks)

          # Setup schema no longer accepts a deployment-wide download token.
          schema = json.loads(read("config/agent-setup.schema.json"))
          schema["properties"]["deployment"]["properties"].pop("downloadToken", None)
          write("config/agent-setup.schema.json", json.dumps(schema, ensure_ascii=False, indent=2) + "\n")

          # Installer: only Admin Secret; initial deploy uses --secrets-file.
          p = "scripts/install-cloudflare.mjs"
          text = read(p)
          text = text.replace(
              'import { copyFileSync, existsSync, readFileSync, writeFileSync } from "node:fs";',
              'import { copyFileSync, existsSync, readFileSync, unlinkSync, writeFileSync } from "node:fs";',
          )
          text = text.replace('const DOWNLOAD_SECRET = "SUB_STORE_PUBLIC_DOWNLOAD_TOKEN";\n', "")
          text = text.replace(
              '''  const configuredAdminToken = stringValue(options.adminToken) || stringValue(process.env.SUB_STORE_ADMIN_TOKEN) || stringValue(deployment.adminToken);
            const configuredDownloadToken = stringValue(options.downloadToken) || stringValue(process.env.SUB_STORE_PUBLIC_DOWNLOAD_TOKEN) || stringValue(deployment.downloadToken);
            const adminToken = configuredAdminToken || generateToken();
            const downloadToken = configuredDownloadToken || generateToken();

            if (!configuredAdminToken || !configuredDownloadToken) {
              if (!configuredAdminToken) deployment.adminToken = adminToken;
              if (!configuredDownloadToken) deployment.downloadToken = downloadToken;
              setup.deployment = deployment;
              writeFileSync(SETUP_PATH, `${JSON.stringify(setup, null, 2)}\n`);
              info(`Generated tokens were saved to ignored file ${SETUP_PATH} for safe resume.`);
            }''',
              '''  const configuredAdminToken = stringValue(options.adminToken) || stringValue(process.env.SUB_STORE_ADMIN_TOKEN) || stringValue(deployment.adminToken);
            const adminToken = configuredAdminToken || generateToken();

            if (!configuredAdminToken) {
              deployment.adminToken = adminToken;
              delete deployment.downloadToken;
              setup.deployment = deployment;
              writeFileSync(SETUP_PATH, `${JSON.stringify(setup, null, 2)}\n`);
              info(`Generated admin token was saved to ignored file ${SETUP_PATH} for safe resume.`);
            }''',
          )
          text = text.replace(
              '''  setSecret(ADMIN_SECRET, adminToken);
            setSecret(DOWNLOAD_SECRET, downloadToken);
            state.setSecrets = true;

            run("pnpm", ["run", "check"], { label: "Build and type-check" });
            run("pnpm", ["run", "migrate:remote"], { label: "Apply remote D1 migrations" });
            state.migrated = true;
            const deployResult = run("pnpm", ["run", "deploy:local"], { label: "Deploy Worker", capture: true, echo: true });
            state.deployed = true;''',
              '''  const secretsPath = "cloudflare/.deploy-secrets.local";
            writeFileSync(secretsPath, `SUB_STORE_ADMIN_TOKEN=${adminToken}\n`, { mode: 0o600 });

            run("pnpm", ["run", "check"], { label: "Build and type-check" });
            run("pnpm", ["run", "migrate:remote"], { label: "Apply remote D1 migrations" });
            state.migrated = true;
            const deployResult = run(
              "pnpm",
              ["--dir", "cloudflare", "exec", "wrangler", "deploy", "--config", "wrangler.deploy.local.jsonc", "--secrets-file", ".deploy-secrets.local"],
              { label: "Deploy Worker with admin secret", capture: true, echo: true },
            );
            unlinkSync(secretsPath);
            state.setSecrets = true;
            state.deployed = true;''',
          )
          text = text.replace(
              'const verification = verifyDeployment({ baseUrl, adminToken, downloadToken, collections: setup.collections || [] });',
              'const verification = verifyDeployment({ baseUrl, adminToken, collections: setup.collections || [] });',
          )
          text = text.replace(
              '''    adminToken,
              downloadToken,
              workerName,''',
              '''    adminToken,
              workerName,''',
          )

          old_verify = '''function verifyDeployment({ baseUrl, adminToken, downloadToken, collections }) {
            const checks = [];
            const adminPaths = ["/api/env", "/api/templates", "/api/sources", "/api/collections"];
            for (const path of adminPaths) {
              checks.push(fetchCheck(`${baseUrl}${path}`, path, adminToken));
            }

            const collectionId = collections.map((collection) => stringValue(collection.id || collection.name)).find(Boolean);
            if (collectionId) {
              checks.push(fetchCheck(`${baseUrl}/api/link/collection/${encodeURIComponent(collectionId)}`, `/api/link/collection/${collectionId}`, adminToken));
              checks.push(fetchCheck(`${baseUrl}/download/collection/${encodeURIComponent(collectionId)}/mihomo?token=${encodeURIComponent(downloadToken)}`, `/download/collection/${collectionId}/mihomo`));
            }

            const failedChecks = checks.filter((check) => !check.ok);
            return {
              ok: failedChecks.length === 0,
              checks,
            };
          }'''
          new_verify = '''function verifyDeployment({ baseUrl, adminToken, collections }) {
            const checks = [];
            const adminPaths = ["/api/env", "/api/templates", "/api/sources", "/api/collections"];
            for (const path of adminPaths) {
              checks.push(fetchCheck(`${baseUrl}${path}`, path, adminToken));
            }

            const collectionId = collections.map((collection) => stringValue(collection.id || collection.name)).find(Boolean);
            if (collectionId) {
              const scopedUrl = createScopedDownloadUrl(baseUrl, "collection", collectionId, "mihomo", adminToken);
              checks.push(scopedUrl
                ? fetchCheck(scopedUrl, `/download/collection/${collectionId}/mihomo (scoped grant)`)
                : { label: `/api/link/collection/${collectionId}`, ok: false, error: "Could not create scoped grant" });
            }

            const failedChecks = checks.filter((check) => !check.ok);
            return {
              ok: failedChecks.length === 0,
              checks,
            };
          }

          function createScopedDownloadUrl(baseUrl, kind, id, target, adminToken) {
            const query = target ? `?target=${encodeURIComponent(target)}` : "";
            const endpoint = `${baseUrl}/api/link/${kind}/${encodeURIComponent(id)}${query}`;
            const args = ["-fsS", "--max-time", "30", "--header", `Authorization: Bearer ${adminToken}`, endpoint];
            const result = spawnSync("curl", args, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
            if (result.status !== 0) {
              warn(`Could not create scoped download grant for ${kind} ${id}: ${String(result.stderr || result.stdout).trim()}`);
              return "";
            }
            try {
              const payload = JSON.parse(result.stdout);
              return stringValue(payload?.data?.url);
            } catch (error) {
              warn(`Invalid scoped download response for ${kind} ${id}: ${error instanceof Error ? error.message : String(error)}`);
              return "";
            }
          }'''
          if old_verify not in text:
              raise SystemExit("installer verify block not found")
          text = text.replace(old_verify, new_verify)

          old_print = '''function printResult({ baseUrl, adminToken, downloadToken, workerName, d1DatabaseName, sources, collections, downloadTargets, verification }) {
            banner("Deployment result");
            console.log(`Worker: ${workerName}`);
            console.log(`D1: ${d1DatabaseName}`);
            console.log(`Admin URL: ${baseUrl}/?token=${adminToken}`);
            console.log("");
            console.log("Download URLs:");
            for (const collection of collections) {
              const id = stringValue(collection.id || collection.name);
              if (!id) continue;
              console.log(`- ${collection.name || id}`);
              console.log(`  ${baseUrl}/download/collection/${encodeURIComponent(id)}?token=${downloadToken}`);
              for (const target of downloadTargets) {
                console.log(`  ${baseUrl}/download/collection/${encodeURIComponent(id)}/${target}?token=${downloadToken}`);
              }
            }'''
          new_print = '''function printResult({ baseUrl, adminToken, workerName, d1DatabaseName, sources, collections, downloadTargets, verification }) {
            banner("Deployment result");
            console.log(`Worker: ${workerName}`);
            console.log(`D1: ${d1DatabaseName}`);
            console.log(`Admin URL: ${baseUrl}/?token=${adminToken}`);
            console.log("");
            console.log("Scoped download URLs:");
            for (const collection of collections) {
              const id = stringValue(collection.id || collection.name);
              if (!id) continue;
              console.log(`- ${collection.name || id}`);
              const autoUrl = createScopedDownloadUrl(baseUrl, "collection", id, "", adminToken);
              if (autoUrl) console.log(`  ${autoUrl}`);
              for (const target of downloadTargets) {
                const targetUrl = createScopedDownloadUrl(baseUrl, "collection", id, target, adminToken);
                if (targetUrl) console.log(`  ${targetUrl}`);
              }
            }'''
          if old_print not in text:
              raise SystemExit("installer print block not found")
          text = text.replace(old_print, new_print)

          # Remove now-unused setSecret helper if present.
          text = re.sub(
              r'\nfunction setSecret\(key, value\) \{.*?\n\}\n\nfunction verifyDeployment',
              '\nfunction verifyDeployment',
              text,
              flags=re.S,
          )
          write(p, text)

          # Ensure generated secret temp file cannot be committed.
          gitignore = read(".gitignore")
          if "cloudflare/.deploy-secrets.local" not in gitignore:
              gitignore += "\ncloudflare/.deploy-secrets.local\n"
          write(".gitignore", gitignore)

          # Worker integration tests now obtain real scoped grants.
          p = "cloudflare/test/worker.test.ts"
          text = read(p)
          text = text.replace('const DOWNLOAD_TOKEN = "test-download-token";\n', "")
          text = text.replace(
              'const download = await workerRequest(`/download/source/scripted-source/json/${DOWNLOAD_TOKEN}`, {}, false);',
              'const download = await workerExports.default.fetch(new Request(await createScopedUrl("source", "scripted-source", "json")));',
          )
          text = text.replace(
              '''    expect(getPath(await jsonObject(linkResponse), "data", "url")).toBe(
                `https://downloads.example.com/download/source/patch-source/json?token=${DOWNLOAD_TOKEN}`,
              );''',
              '''    const linkUrl = String(getPath(await jsonObject(linkResponse), "data", "url"));
              expect(linkUrl).toMatch(/^https:\/\/downloads\.example\.com\/download\/source\/patch-source\/json\?token=.+/);
              expect((await workerExports.default.fetch(new Request(linkUrl))).status).toBe(200);''',
          )
          text = text.replace(
              'const download = await workerRequest(`/download/collection/all-enabled/json/${DOWNLOAD_TOKEN}`, {}, false);',
              'const download = await workerExports.default.fetch(new Request(await createScopedUrl("collection", "all-enabled", "json")));',
          )
          text = text.replace(
              '''    const download = await workerRequest(
                `/download/collection/test-collection/mihomo/${DOWNLOAD_TOKEN}`,
                {},
                false,
              );''',
              '''    const download = await workerExports.default.fetch(
                new Request(await createScopedUrl("collection", "test-collection", "mihomo")),
              );''',
          )
          helper = '''
          async function createScopedUrl(resourceType: "source" | "collection", resourceId: string, target?: string) {
            const response = await workerRequest("/api/shares", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ resourceType, resourceId, target }),
            });
            expect(response.status).toBe(200);
            return String(getPath(await jsonObject(response), "data", "url"));
          }

          '''
          marker = 'async function workerRequest('
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit("worker test helper insertion marker not found")
              text = text.replace(marker, helper + marker, 1)
          write(p, text)

          # Current docs: one admin secret, download links are scoped grants.
          replacements = {
            "README.md": [
              ("### 1. 准备两个不同的随机 Token", "### 1. 准备一个管理员 Token"),
              ("第一行用于 `SUB_STORE_ADMIN_TOKEN`，第二行用于 `SUB_STORE_PUBLIC_DOWNLOAD_TOKEN`。不要使用 README、截图或示例里的固定字符串。", "这个值用于 `SUB_STORE_ADMIN_TOKEN`。订阅下载不再使用全局 Download Token；复制订阅链接时会自动创建独立的 Scoped Download Grant。不要使用 README、截图或示例里的固定字符串。"),
              ("两个 Secret 输入框必须填写你刚生成的不同随机值。", "只需要填写管理员 Secret。订阅下载凭证由 D1 中的 Scoped Download Grant 按链接独立生成。"),
              ("需要单独生成两个跨平台 Token：", "需要单独生成管理员 Token："),
              ("pnpm run tokens:generate", "pnpm run token:generate"),
              ("- 管理端和 `/api/*` 使用 admin token；`/download/*` 使用 download token。", "- 管理端和 `/api/*` 使用 Admin Token；`/download/*` 只接受按 Source / Collection 生成的 Scoped Download Grant。"),
              ("- 独立、限时、可撤销、可限制格式的下载授权。", "- 每个订阅链接使用独立、可撤销、可限制格式/有效期的 Scoped Download Grant；不保留全局下载总钥匙。"),
            ],
            "README.en.md": [
              ("### 1. Prepare two different random tokens", "### 1. Prepare one admin token"),
              ("Use the first line for `SUB_STORE_ADMIN_TOKEN` and the second for `SUB_STORE_PUBLIC_DOWNLOAD_TOKEN`. Never deploy fixed values copied from documentation or screenshots.", "Use the value for `SUB_STORE_ADMIN_TOKEN`. Subscription downloads no longer use a deployment-wide download token; copying a subscription link automatically issues a scoped D1 download grant."),
              ("Both secret fields must contain the different random values you generated.", "Only the admin secret is required. Subscription credentials are issued per link as scoped D1 download grants."),
              ("Generate both deployment tokens with:", "Generate the admin token with:"),
              ("pnpm run tokens:generate", "pnpm run token:generate"),
              ("- Scoped expiring download grants and a bounded 50-entry recycle bin.", "- Scoped, revocable download grants are the only subscription credentials; there is no deployment-wide download master token."),
            ],
            "docs/upgrading.md": [
              ("并确认你仍保存着 admin token 和 download token。", "并确认你仍保存着 Admin Token。Scoped Download Grant 保存在 D1 中，不需要维护部署级 Download Token。"),
              ("- 两个 Worker Secrets 仍存在", "- `SUB_STORE_ADMIN_TOKEN` Worker Secret 仍存在"),
              ("安装器会复用本地保存的 D1 ID 和 Token，", "安装器会复用本地保存的 D1 ID 和 Admin Token，"),
            ],
            "SECURITY.md": [
              ("- `SUB_STORE_PUBLIC_DOWNLOAD_TOKEN` for `/download/*`.", "- `/download/*` uses scoped download grants whose plaintext token is returned only when a link is created; D1 stores only the token hash."),
            ],
            "RELEASE_NOTES.md": [
              ("admin and download token generation", "admin token generation"),
            ],
            "ROADMAP.md": [
              ("Worker Secrets for admin and download tokens.", "A Worker Secret for admin access; subscription access uses scoped D1 download grants."),
            ],
          }
          for path, pairs in replacements.items():
              text = read(path)
              for old_text, new_text in pairs:
                  text = text.replace(old_text, new_text)
              write(path, text)

          # Rewrite quick-start with the new auth model.
          quick = read("docs/quick-start.md")
          quick = quick.replace("- 两个不同的随机 Token；", "- 一个管理员 Token；")
          quick = re.sub(
              r'## 第一步：生成两个 Token.*?## 第二步：部署到 Cloudflare',
              '''## 第一步：生成管理员 Token

          使用密码管理器生成一个管理员口令，或运行：

          ```bash
          pnpm run token:generate
          ```

          它只用于 `SUB_STORE_ADMIN_TOKEN`。订阅下载不设置全局总钥匙；每次复制 Source / Collection 订阅链接时，后台会自动在 D1 创建独立的 Scoped Download Grant。

          ## 第二步：部署到 Cloudflare''',
              quick,
              flags=re.S,
          )
          quick = quick.replace("3. `SUB_STORE_ADMIN_TOKEN` 填管理 Token。\n4. `SUB_STORE_PUBLIC_DOWNLOAD_TOKEN` 填下载 Token。\n5. 构建命令是", "3. `SUB_STORE_ADMIN_TOKEN` 填管理 Token。\n4. 构建命令是")
          quick = quick.replace("6. 部署命令是", "5. 部署命令是")
          quick = quick.replace("如果页面显示“数据加载失败”，输入 `SUB_STORE_ADMIN_TOKEN`，不要输入下载 Token。", "如果页面显示“数据加载失败”，输入 `SUB_STORE_ADMIN_TOKEN`。")
          quick = quick.replace("下载链接使用 `SUB_STORE_PUBLIC_DOWNLOAD_TOKEN`。不要把 admin token 放进客户端订阅链接。", "点击复制链接时会自动创建只对应当前 Source / Collection（以及所选输出格式）的 Scoped Download Grant。Admin Token 不会进入客户端订阅链接。")
          write("docs/quick-start.md", quick)

          # Deployment guide: current installation paths must describe one secret + grants.
          dep = read("docs/deployment.md")
          dep = dep.replace("- `SUB_STORE_PUBLIC_DOWNLOAD_TOKEN`\n", "")
          dep = dep.replace("跨平台生成两个 token：", "生成管理员 Token：")
          dep = dep.replace("第一行用于 admin token，第二行用于 download token。两个值必须不同。", "生成值用于 `SUB_STORE_ADMIN_TOKEN`。订阅下载凭证由 Scoped Download Grant 独立生成。")
          dep = dep.replace("pnpm run tokens:generate", "pnpm run token:generate")
          dep = dep.replace("- 生成或使用 `SUB_STORE_ADMIN_TOKEN` / `SUB_STORE_PUBLIC_DOWNLOAD_TOKEN`。", "- 生成或使用 `SUB_STORE_ADMIN_TOKEN`。")
          dep = dep.replace("- 写入 Worker secrets。", "- 首次/后续部署都通过 `--secrets-file` 写入唯一的 Admin Worker Secret。")
          dep = dep.replace("pnpm --dir cloudflare exec wrangler secret put SUB_STORE_PUBLIC_DOWNLOAD_TOKEN --config wrangler.deploy.local.jsonc\n", "")
          dep = dep.replace("SUB_STORE_PUBLIC_DOWNLOAD_TOKEN=dev-download-token\n", "")
          dep = dep.replace("继续使用原来的 Worker、D1 和 Worker Secrets。", "继续使用原来的 Worker、D1 和 Admin Worker Secret。Scoped Download Grant 随 D1 保留。")
          dep = re.sub(
              r'## 7\. 下载链接.*?## 从旧版本升级',
              '''## 7. 下载链接

          管理界面：

          ```text
          https://substore.example.com/?token=<admin-token>
          ```

          Source / Collection 的订阅链接不再共享一个部署级 Download Token。管理界面调用 `/api/link/source/:id` 或 `/api/link/collection/:id` 时，会自动创建新的 Scoped Download Grant，并把一次性明文 token 放入返回的订阅 URL。

          每个 Grant 可以限定：
          - Source 或 Collection；
          - 输出格式（可选）；
          - 有效期（可选）；
          - 启用 / 撤销状态。

          D1 只保存 token 的 SHA-256 hash。管理员可以在“分享/授权”管理界面撤销旧链接。

          不带输出格式的授权链接仍可按客户端 User-Agent 自动选择格式。远程订阅缓存与 `refresh=1` 行为保持不变。

          ## 从旧版本升级''',
              dep,
              flags=re.S,
          )
          write("docs/deployment.md", dep)

          # Troubleshooting current behavior: remove deployment-wide-token instructions.
          trouble = read("docs/troubleshooting.md")
          trouble = trouble.replace("正常情况下，`SUB_STORE_ADMIN_TOKEN` 和 `SUB_STORE_PUBLIC_DOWNLOAD_TOKEN` 需要你自己填写两个不同的随机值。", "正常情况下只需要配置 `SUB_STORE_ADMIN_TOKEN`。订阅下载凭证由 Scoped Download Grant 自动生成。")
          trouble = trouble.replace("- `SUB_STORE_PUBLIC_DOWNLOAD_TOKEN`\n", "")
          trouble = re.sub(r'^.*wrangler secret put SUB_STORE_PUBLIC_DOWNLOAD_TOKEN.*\n', "", trouble, flags=re.M)
          trouble = trouble.replace("检查链接里是否使用 download token，而不是 admin token：", "检查链接是否来自管理端生成的 Scoped Download Grant，而不是手工把 Admin Token 拼进 URL：")
          trouble = trouble.replace("管理界面和 `/api/*` 使用 admin token。`/download/*` 使用 download token。", "管理界面和 `/api/*` 使用 Admin Token；`/download/*` 使用 Scoped Download Grant。")
          write("docs/troubleshooting.md", trouble)

          # Historical design note is superseded for this personal edition.
          spec = "docs/superpowers/specs/2026-07-11-free-upstream-compatibility-major-design.md"
          text = read(spec)
          text = text.replace(
              "The existing deployment-wide download token remains supported. A scoped token grants access only to its source or collection and optional target.",
              "Personal-edition override: the deployment-wide download token is removed. A scoped token grants access only to its source or collection and optional target.",
          )
          write(spec, text)

          # Cleanup one-time audit/migration workflows before commit.
          Path(".github/workflows/audit-download-token.yml").unlink(missing_ok=True)
          Path(".github/workflows/migrate-scoped-downloads.yml").unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Regenerate Worker binding types
        run: |
          pnpm --dir cloudflare exec wrangler types ./src/worker-configuration.d.ts --config wrangler.jsonc --env-interface SubStoreEnv --include-runtime false --strict-vars false

      - name: Validate code, tests, installer and deployment
        run: |
          pnpm run check
          pnpm run check:tests
          pnpm run check:installer
          pnpm run check:deploy-experience
          pnpm run check:worker-contract
          pnpm run deploy:dry-run

      - name: Enforce removal of deployment-wide download secret
        run: |
          set -euo pipefail
          if git grep -n 'SUB_STORE_PUBLIC_DOWNLOAD_TOKEN' -- . ':!CHANGELOG.md'; then
            echo "Deployment-wide download token reference remains."
            exit 1
          fi
          test "$(node -e 'const p=require("./package.json"); console.log(p.cloudflare.bindings.SUB_STORE_ADMIN_TOKEN ? 1 : 0)')" = "1"
          test "$(node -e 'const p=require("./package.json"); console.log(Object.keys(p.cloudflare.bindings).length)')" = "2"

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: use scoped grants as the only download credential"
          git push origin main
