name: Audit download token references

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-download-token.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find references
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PUBLIC DOWNLOAD TOKEN ==="
          grep -RIn --exclude-dir=.git --exclude='audit-download-token.yml' 'SUB_STORE_PUBLIC_DOWNLOAD_TOKEN' . || true
          echo "=== DOWNLOAD TOKEN TEXT ==="
          grep -RIn --exclude-dir=.git --exclude='audit-download-token.yml' -E 'download.?token|Download Token|download token' . || true
          echo "=== DOWNLOAD GRANT ==="
          grep -RIn --exclude-dir=.git --exclude='audit-download-token.yml' -E 'download.?grant|Download Grant|download grant' . || true
