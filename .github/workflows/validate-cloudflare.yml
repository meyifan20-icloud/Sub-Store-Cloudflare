name: Validate Cloudflare deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Worker and frontend
        run: |
          pnpm run check
          pnpm run check:tests
          pnpm run check:deploy-config -- wrangler.jsonc

      - name: Wrangler dry run
        run: pnpm run deploy:dry-run
